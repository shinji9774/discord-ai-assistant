name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # 詳細ページだけを公開し直すときに、タグを選んで実行する。AWS へのリリースは行わない
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # タグ形式の検査に公式 action は無い。手動実行ではブランチも選べるため、ref の種類も確かめる
  check-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]] || ! echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid ref: ${GITHUB_REF}"
            exit 1
          fi

  test:
    needs: check-ref
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Build change set name
        id: tag
        run: echo "changeset_name=release-${GITHUB_REF_NAME//./-}" >> "${GITHUB_OUTPUT}"
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      # buildx は既定で attestation を付けて OCI image index にするが、
      # Lambda は Docker Image Manifest V2 Schema 2 しか受け付けないため無効にする。
      # https://repost.aws/knowledge-center/lambda-ecr-image-errors
      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          target: runtime
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }}
          provenance: false
          sbom: false
      # change set は作るだけで実行しない。失敗した change set は原因確認のため残す
      - name: Create change set
        id: changeset
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ vars.APP_STACK_NAME }}
          template: cfn/app.yaml
          capabilities: CAPABILITY_IAM
          parameter-overrides: ImageUri=${{ steps.login-ecr.outputs.registry }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }},DiscordPublicKey=${{ secrets.DISCORD_PUBLIC_KEY }}
          no-execute-changeset: true
          no-delete-failed-changeset: true
          change-set-name: ${{ steps.tag.outputs.changeset_name }}
      # public リポジトリのため、プロパティの値・PhysicalResourceId は summary に出さない
      - name: Write change set summary
        env:
          CHANGESET_NAME: ${{ steps.changeset.outputs.change-set-name }}
          CHANGES_SUMMARY: ${{ steps.changeset.outputs.changes-summary }}
          STACK_NAME: ${{ vars.APP_STACK_NAME }}
        run: |
          {
            echo "## CloudFormation change set"
            echo
            echo "- Stack: \`${STACK_NAME}\`"
            echo "- Change set: \`${CHANGESET_NAME}\`"
            echo "- Console: [Open the stack in the AWS console](https://${AWS_REGION}.console.aws.amazon.com/cloudformation/home?region=${AWS_REGION}#/stacks?filteringText=${STACK_NAME}) (see the \"Change sets\" tab)"
            echo
            printf '%s' "${CHANGES_SUMMARY}" | jq -r '
              def changed_properties:
                [(.Details // [])[].Target | (.Name // .Attribute)] | unique | if length == 0 then "-" else join(", ") end;
              if (.changes | length) == 0 then
                "No resource changes."
              else
                "| Action | Logical ID | Type | Replacement | Changed properties |",
                "|---|---|---|---|---|",
                (.changes[].ResourceChange
                  | "| \(.Action) | \(.LogicalResourceId) | \(.ResourceType) | \(.Replacement // "-") | \(changed_properties) |"),
                (if .truncated then "", "> Showing \(.changes | length) of \(.totalChanges) changes." else empty end)
              end'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

  build-pages:
    runs-on: ubuntu-latest
    needs: test
    # configure-pages が Pages のサイト情報を読むため pages: read を付ける
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build pages with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-pages
    # 公開どうしの重なりだけを直列にする。AWS へのリリースは対象にしない
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
