name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # タグ形式の検査に公式 action は無い。change set 名も同じステップで作る
      - name: Validate tag format
        id: tag
        run: |
          if ! echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "changeset_name=release-${GITHUB_REF_NAME//./-}" >> "${GITHUB_OUTPUT}"
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      # buildx は既定で attestation を付けて OCI image index にするが、
      # Lambda は Docker Image Manifest V2 Schema 2 しか受け付けないため無効にする。
      # https://repost.aws/knowledge-center/lambda-ecr-image-errors
      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          target: runtime
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }}
          provenance: false
          sbom: false
      # change set は作るだけで実行しない。失敗した change set は原因確認のため残す
      - name: Create change set
        id: changeset
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ vars.APP_STACK_NAME }}
          template: cfn/app.yaml
          capabilities: CAPABILITY_IAM
          parameter-overrides: ImageUri=${{ steps.login-ecr.outputs.registry }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }},DiscordPublicKey=${{ secrets.DISCORD_PUBLIC_KEY }}
          no-execute-changeset: true
          no-delete-failed-changeset: true
          change-set-name: ${{ steps.tag.outputs.changeset_name }}
      - name: Show change set name
        env:
          CHANGESET_NAME: ${{ steps.changeset.outputs.change-set-name }}
          STACK_NAME: ${{ vars.APP_STACK_NAME }}
        run: |
          echo "Change set created: ${CHANGESET_NAME} (stack: ${STACK_NAME})" | tee -a "${GITHUB_STEP_SUMMARY}"
