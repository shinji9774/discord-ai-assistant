AWSTemplateFormatVersion: "2010-09-09"
Description: discord-ai-assistant のアプリ本体（ingress、worker、voicereporter、voicefailure、recordingfailure の Lambda 関数、Function URL、録音タスク、録音の一時的な置き場）

Parameters:
  ImageUri:
    Type: String
    Description: ECR のイメージ URI（タグか digest つき）
  DiscordPublicKey:
    Type: String
    Description: Discord アプリの公開鍵（16 進数）
  BotTokenParameterName:
    Type: String
    Description: bot トークンを入れた SSM の SecureString のパラメータ名
    Default: /discord-ai-assistant/bot-token
    AllowedPattern: ^/.+

Resources:
  IngressLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-ingress
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: 30

  VoiceReporterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-voicereporter
      RetentionInDays: 30

  VoiceFailureLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-voicefailure
      RetentionInDays: 30

  RecorderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}-recorder
      RetentionInDays: 30

  RecordingFailureLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-recordingfailure
      RetentionInDays: 30

  # /summarize-voice の音声と途中結果の一時的な置き場。公開しない。バケットポリシーとバージョニングは使わない
  VoiceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # 投稿の直後に bot が消す。消せなかったものも、作成から 1 日で消す（2 日以内に消す）
      LifecycleConfiguration:
        Rules:
          - Id: ExpireVoiceData
            Status: Enabled
            ExpirationInDays: 1

  IngressRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: ingress
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt IngressLogGroup.Arn
              - Sid: InvokeWorker
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-worker

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WorkerLogGroup.Arn
              - Sid: InvokeBedrockModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: "*"
              - Sid: SearchWeb
                Effect: Allow
                Action: bedrock-agentcore:InvokeWebSearch
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1
              - Sid: TranslateText
                Effect: Allow
                Action:
                  - translate:TranslateText
                  - translate:TranslateDocument
                Resource: "*"
              - Sid: DetectSourceLanguage
                Effect: Allow
                Action: comprehend:DetectDominantLanguage
                Resource: "*"
              - Sid: ReadBotToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BotTokenParameterName}
              # 音声とマニフェストを置き、失敗時に消す。Transcribe は worker の権限で音声を読み、結果を書く
              - Sid: StoreVoiceData
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${VoiceBucket.Arn}/*
              # ないオブジェクトを 403 ではなく 404 として受け取るために要る
              - Sid: ListVoiceData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt VoiceBucket.Arn
              # StartTranscriptionJob はジョブの ARN で絞れないため、結果の置き場のバケットで絞る
              - Sid: StartTranscription
                Effect: Allow
                Action: transcribe:StartTranscriptionJob
                Resource: "*"
                Condition:
                  StringEquals:
                    transcribe:OutputBucketName: !Ref VoiceBucket
              # 録音タスクを起動する。起動先は録音用のクラスターに限る
              - Sid: RunRecorderTask
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref RecorderTaskDefinition
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt RecorderCluster.Arn
              # RunTask は、タスク定義のタスクロールと実行ロールを ECS へ渡す
              - Sid: PassRecorderRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt RecorderTaskRole.Arn
                  - !GetAtt RecorderExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  VoiceReporterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: voicereporter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt VoiceReporterLogGroup.Arn
              # マニフェストと文字起こしを読み、report.claim を作り、依頼のデータを消す
              - Sid: StoreVoiceData
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${VoiceBucket.Arn}/*
              # ないマニフェストを 403 ではなく 404 として受け取るために要る
              - Sid: ListVoiceData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt VoiceBucket.Arn
              - Sid: ReadTranscriptionJob
                Effect: Allow
                Action: transcribe:GetTranscriptionJob
                Resource: !Sub arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/summarize-voice-*
              - Sid: InvokeBedrockModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: "*"
              - Sid: ReadBotToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BotTokenParameterName}
              - Sid: RetryTranscription
                Effect: Allow
                Action: transcribe:StartTranscriptionJob
                Resource: "*"
                Condition:
                  StringEquals:
                    transcribe:OutputBucketName: !Ref VoiceBucket
              - Sid: InvokeFailureDestination
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt VoiceFailureFunction.Arn

  VoiceFailureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: voicefailure
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt VoiceFailureLogGroup.Arn
              # 失敗の通知の重複を防ぐ report.claim を作り、依頼のデータを消す
              - Sid: StoreVoiceData
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${VoiceBucket.Arn}/*
              # ないオブジェクトを 403 ではなく 404 として受け取るために要る
              - Sid: ListVoiceData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt VoiceBucket.Arn
              - Sid: ReadBotToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BotTokenParameterName}

  # 録音タスクがイメージを取得し、ログを書く
  RecorderExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ecs-tasks.amazonaws.com
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  RecorderTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ecs-tasks.amazonaws.com
      Policies:
        - PolicyName: recorder
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ロックと印を読み書きし、音声とマニフェストを置く。Transcribe は録音タスクの権限で音声を読み、結果を書く
              - Sid: StoreVoiceData
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${VoiceBucket.Arn}/*
              # ないオブジェクトを 403 ではなく 404 として受け取るために要る
              - Sid: ListVoiceData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt VoiceBucket.Arn
              # StartTranscriptionJob はジョブの ARN で絞れないため、結果の置き場のバケットで絞る
              - Sid: StartTranscription
                Effect: Allow
                Action: transcribe:StartTranscriptionJob
                Resource: "*"
                Condition:
                  StringEquals:
                    transcribe:OutputBucketName: !Ref VoiceBucket
              - Sid: ReadBotToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BotTokenParameterName}

  RecordingFailureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: recordingfailure
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RecordingFailureLogGroup.Arn
              # ロックと開始の印を読み、録音のデータとロックを消す
              - Sid: StoreVoiceData
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${VoiceBucket.Arn}/*
              # ないオブジェクトを 403 ではなく 404 として受け取るために要る
              - Sid: ListVoiceData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt VoiceBucket.Arn
              - Sid: ReadBotToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BotTokenParameterName}

  IngressFunction:
    Type: AWS::Lambda::Function
    DependsOn: IngressLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ingress
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        EntryPoint: ["/ingress"]
      Architectures: [x86_64]
      Timeout: 3
      MemorySize: 256
      #ReservedConcurrentExecutions: 10
      Role: !GetAtt IngressRole.Arn
      Environment:
        Variables:
          DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
          WORKER_FUNCTION_NAME: !Ref WorkerFunction

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-worker
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        EntryPoint: ["/worker"]
      Architectures: [x86_64]
      Timeout: 600
      # CPU とネットワークの帯域はメモリの量に比例する。録音の取得と転送を速くするために増やす（値は実機の計測で見直す）
      MemorySize: 1024
      # 録音の zip を /tmp に保存してからトラックを取り出す
      EphemeralStorage:
        Size: 10240
      Role: !GetAtt WorkerRole.Arn
      Environment:
        Variables:
          BOT_TOKEN_PARAMETER_NAME: !Ref BotTokenParameterName
          VOICE_BUCKET_NAME: !Ref VoiceBucket
          RECORDER_CLUSTER_ARN: !GetAtt RecorderCluster.Arn
          RECORDER_TASK_DEFINITION_ARN: !Ref RecorderTaskDefinition
          RECORDER_SUBNET_IDS: !Join [",", [!Ref RecorderSubnetA, !Ref RecorderSubnetB]]
          RECORDER_SECURITY_GROUP_ID: !Ref RecorderSecurityGroup

  # 非同期呼び出しの再試行を止める（同じコマンドを二重に実行しない）
  WorkerEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  VoiceReporterFunction:
    Type: AWS::Lambda::Function
    DependsOn: VoiceReporterLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-voicereporter
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        EntryPoint: ["/voicereporter"]
      Architectures: [x86_64]
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt VoiceReporterRole.Arn
      Environment:
        Variables:
          BOT_TOKEN_PARAMETER_NAME: !Ref BotTokenParameterName
          VOICE_BUCKET_NAME: !Ref VoiceBucket

  # /summarize-voice の文字起こしが終わったら voicereporter を呼ぶ。接頭辞は voicesummary.JobNamePrefix と同じにする
  VoiceTranscriptionFinishedRule:
    Type: AWS::Events::Rule
    Properties:
      Description: /summarize-voice の文字起こしの完了と失敗を voicereporter に伝える
      State: ENABLED
      EventPattern:
        source: ["aws.transcribe"]
        detail-type: ["Transcribe Job State Change"]
        detail:
          TranscriptionJobStatus: ["COMPLETED", "FAILED"]
          TranscriptionJobName: [{"prefix": "summarize-voice-"}]
      Targets:
        - Id: voicereporter
          Arn: !GetAtt VoiceReporterFunction.Arn

  VoiceReporterEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VoiceReporterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt VoiceTranscriptionFinishedRule.Arn

  # voicereporter の失敗は、同じイベントで 2 回までやり直す。使い切ったら voicefailure が失敗を投稿する
  # 経過時間の上限は、再試行の間隔と実行時間を収め、S3 のライフサイクル（1 日）より十分に短くする
  VoiceReporterEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref VoiceReporterFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt VoiceFailureFunction.Arn

  VoiceFailureFunction:
    Type: AWS::Lambda::Function
    DependsOn: VoiceFailureLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-voicefailure
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        EntryPoint: ["/voicefailure"]
      Architectures: [x86_64]
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt VoiceFailureRole.Arn
      Environment:
        Variables:
          BOT_TOKEN_PARAMETER_NAME: !Ref BotTokenParameterName
          VOICE_BUCKET_NAME: !Ref VoiceBucket

  # 録音タスクのネットワーク。Discord へ出るだけなので、パブリック IP でパブリックサブネットに置く（NAT は置かない）
  RecorderVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  RecorderInternetGateway:
    Type: AWS::EC2::InternetGateway

  RecorderGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref RecorderVpc
      InternetGatewayId: !Ref RecorderInternetGateway

  RecorderSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecorderVpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  RecorderSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecorderVpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  RecorderRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecorderVpc

  RecorderDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: RecorderGatewayAttachment
    Properties:
      RouteTableId: !Ref RecorderRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref RecorderInternetGateway

  RecorderSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref RecorderSubnetA
      RouteTableId: !Ref RecorderRouteTable

  RecorderSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref RecorderSubnetB
      RouteTableId: !Ref RecorderRouteTable

  # 内向きは許可しない。外向きは Discord と AWS の API へ出る
  RecorderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: recorder task - no inbound, all outbound
      VpcId: !Ref RecorderVpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  # 録音専用のクラスター。録音していない間はタスクが無く、課金されない
  RecorderCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AWS::StackName}-recorder

  # エフェメラルストレージは既定の 20 GiB を使う（録音中の音声を置く）
  RecorderTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-recorder
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt RecorderExecutionRole.Arn
      TaskRoleArn: !GetAtt RecorderTaskRole.Arn
      ContainerDefinitions:
        - Name: recorder
          Image: !Ref ImageUri
          EntryPoint: ["/recorder"]
          Essential: true
          Environment:
            - Name: BOT_TOKEN_PARAMETER_NAME
              Value: !Ref BotTokenParameterName
            - Name: VOICE_BUCKET_NAME
              Value: !Ref VoiceBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RecorderLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: recorder

  RecordingFailureFunction:
    Type: AWS::Lambda::Function
    DependsOn: RecordingFailureLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-recordingfailure
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        EntryPoint: ["/recordingfailure"]
      Architectures: [x86_64]
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt RecordingFailureRole.Arn
      Environment:
        Variables:
          BOT_TOKEN_PARAMETER_NAME: !Ref BotTokenParameterName
          VOICE_BUCKET_NAME: !Ref VoiceBucket

  # 失敗の投稿に失敗したときだけ、同じイベントで 2 回までやり直す（ロックの解除の失敗ではエラーにしない）
  # 経過時間の上限は VoiceReporter と同じ。使い切った後の宛先は置かない
  RecordingFailureEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref RecordingFailureFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600

  # 録音タスクが止まったら recordingfailure を呼ぶ。recorder が引き渡しを終えて exit 0 で止まったときは、残ったロックを解除するだけにする
  RecorderStoppedRule:
    Type: AWS::Events::Rule
    Properties:
      Description: 録音タスクの停止を recordingfailure に伝える
      State: ENABLED
      EventPattern:
        source: ["aws.ecs"]
        detail-type: ["ECS Task State Change"]
        detail:
          clusterArn: [!GetAtt RecorderCluster.Arn]
          lastStatus: ["STOPPED"]
      Targets:
        - Id: recordingfailure
          Arn: !GetAtt RecordingFailureFunction.Arn

  RecordingFailureEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RecordingFailureFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RecorderStoppedRule.Arn

  IngressFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt IngressFunction.Arn
      AuthType: NONE

  # Function URL（AuthType NONE）は 2 つの権限がそろって初めて公開される
  IngressInvokeFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngressFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  IngressInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngressFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: Discord の Interactions Endpoint URL に設定する URL
    Value: !GetAtt IngressFunctionUrl.FunctionUrl
